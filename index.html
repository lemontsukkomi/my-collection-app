<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>我的收藏</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    .collection-item {
  background: #ffffff;
  border: 1px solid #dddddd;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;

  display: flex;
  gap: 12px;
  align-items: center;
}

.collection-item img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 10px;
  background: #eeeeee;
  flex-shrink: 0;
}

.collection-info {
  flex: 1;
}

.collection-name {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 6px;
}

.collection-meta {
  font-size: 14px;
  color: #666;
  line-height: 1.6;
}
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #scanButton {
      background: #eeeeee;
    }

    #saveButton {
      margin-top: 25px;
    }

    #reader {
      margin-top: 15px;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    #imagePreview {
      display: none;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    #imageInfo {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }

    #searchResult img {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-button {
      flex: 1;
      margin-top: 0;
      background: #eeeeee;
      font-weight: bold;
    }

    .tab-button.active {
      background: #dcdcdc;
    }

    .tab-page {
      display: none;
    }

    .tab-page.active {
      display: block;
    }


    .collection-item {
      cursor: pointer;
    }

    .collection-item:active {
      transform: scale(0.995);
    }

    .detail-back-button {
      margin-top: 0;
      margin-bottom: 16px;
      background: #eeeeee;
    }

    .detail-image {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
      background: #f1f1f1;
      margin-bottom: 18px;
    }

    .detail-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid #eeeeee;
      line-height: 1.5;
      word-break: break-word;
    }

    .detail-label {
      font-weight: bold;
      color: #555;
      display: block;
      margin-bottom: 4px;
    }

    .detail-empty {
      color: #999;
    }


    /* 收藏頁：三欄圖片格狀顯示 */
    #collectionList {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    #collectionList .collection-item {
      display: block;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      background: #eeeeee;
      box-shadow: none;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    #collectionList .collection-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 0;
      background: #eeeeee;
    }

    #collectionList .collection-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: #eeeeee;
    }

    #collectionList .collection-info {
      display: none;
    }

    #collectionList .empty-list-message {
      grid-column: 1 / -1;
      text-align: center;
      color: #888;
      padding: 20px 0;
    }


    .detail-actions {
      margin-top: 22px;
    }

    .edit-button {
      background: #eeeeee;
      font-weight: bold;
    }

    .edit-image-current {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 10px;
      background: #f1f1f1;
      margin-top: 10px;
    }

    #editImagePreview {
      display: none;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    #editImageInfo,
    #editMessage {
      margin-top: 10px;
      text-align: center;
      color: #666;
    }

    #editSaveButton {
      margin-top: 25px;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>📦 我的收藏</h1>

  <div class="tabs">
    <button
      id="addTabButton"
      class="tab-button active"
      type="button"
      onclick="showTab('add')"
    >
      ➕ 新增物品
    </button>

    <button
      id="collectionTabButton"
      class="tab-button"
      type="button"
      onclick="showTab('collection')"
    >
      📚 我的收藏
    </button>
  </div>

  <!-- =========================
       新增物品頁（預設首頁）
  ========================== -->
  <div
    id="addPage"
    class="tab-page active"
  >

    <label>主圖片</label>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      onchange="handleImageSelect(this)"
    >

    <img
      id="imagePreview"
      alt="圖片預覽"
    >

    <div id="imageInfo"></div>

    <label>條碼</label>

    <input
      id="barcode"
      type="text"
      placeholder="掃描或手動輸入條碼"
    >

    <button
      type="button"
      onclick="searchBarcode(
        document.getElementById('barcode').value
      )"
    >
      🔍 搜尋條碼
    </button>

    <button
      id="scanButton"
      type="button"
      onclick="startScanner()"
    >
      📷 掃描條碼
    </button>

    <div id="reader"></div>

    <div
      id="searchResult"
      style="
        margin-top:15px;
        padding:15px;
        border-radius:10px;
        display:none;
      "
    ></div>

    <label>收藏名稱 *</label>

    <input
      id="name"
      type="text"
      placeholder="例如：寶可夢卡盒"
    >

    <label>分類</label>

    <input
      id="category"
      type="text"
      placeholder="例如：寶可夢"
    >

    <label>存放位置</label>

    <input
      id="location"
      type="text"
      placeholder="例如：防潮箱第一層"
    >

    <label>數量</label>

    <input
      id="quantity"
      type="number"
      value="1"
      min="1"
    >

    <label>購買日期</label>

    <input
      id="purchaseDate"
      type="date"
    >

    <label>購入價格</label>

    <input
      id="price"
      type="number"
      placeholder="例如：500"
    >

    <label>備註</label>

    <textarea
      id="notes"
      rows="4"
      placeholder="其他想記錄的內容"
    ></textarea>

    <button
      id="saveButton"
      type="button"
      onclick="saveItem()"
    >
      💾 儲存收藏
    </button>

    <div id="message"></div>

  </div>

  <!-- =========================
       我的收藏頁
  ========================== -->
  <div
    id="collectionPage"
    class="tab-page"
  >

    <div
      id="collectionCount"
      style="
        text-align:center;
        margin-bottom:12px;
        color:#666;
      "
    >
      尚未載入收藏
    </div>

    <input
      id="textSearch"
      type="text"
      placeholder="搜尋名稱、分類、位置、備註..."
      oninput="filterCollectionList()"
    >

    <div
      id="collectionList"
      style="margin-top:15px;"
    ></div>

  </div>

  <div
    id="detailPage"
    class="tab-page"
  >
    <button
      type="button"
      class="detail-back-button"
      onclick="backToCollection()"
    >
      ← 返回我的收藏
    </button>

    <div id="detailContent"></div>
  </div>

  <div
    id="editPage"
    class="tab-page"
  >
    <button
      type="button"
      class="detail-back-button"
      onclick="cancelEdit()"
    >
      ← 取消編輯
    </button>

    <h2>✏️ 編輯收藏</h2>

    <label>目前圖片</label>
    <div id="editCurrentImage"></div>

    <label>更換圖片（可不選）</label>
    <input
      id="editImageInput"
      type="file"
      accept="image/*"
      onchange="handleEditImageSelect(this)"
    >

    <img
      id="editImagePreview"
      alt="新圖片預覽"
    >

    <div id="editImageInfo"></div>

    <label>收藏名稱 *</label>
    <input id="editName" type="text">

    <label>分類</label>
    <input id="editCategory" type="text">

    <label>存放位置</label>
    <input id="editLocation" type="text">

    <label>數量</label>
    <input
      id="editQuantity"
      type="number"
      min="1"
      value="1"
    >

    <label>購買日期</label>
    <input
      id="editPurchaseDate"
      type="date"
    >

    <label>購入價格</label>
    <input
      id="editPrice"
      type="number"
    >

    <label>備註</label>
    <textarea
      id="editNotes"
      rows="4"
    ></textarea>

    <label>條碼</label>
    <input
      id="editBarcode"
      type="text"
    >

    <button
      id="editSaveButton"
      type="button"
      onclick="saveEdit()"
    >
      💾 儲存修改
    </button>

    <div id="editMessage"></div>
  </div>

</div>


<script>

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbwygzQlNKxnAddoB3l387NsQnxdoFse6BEHYDf0w8_kPOyJ3KJiPA4oIbPb0F9KXnCE/exec";


  

  let collectionLoaded = false;


  function showTab(tabName) {

    const addPage =
      document.getElementById("addPage");

    const collectionPage =
      document.getElementById("collectionPage");

    const detailPage =
      document.getElementById("detailPage");

    const editPage =
      document.getElementById("editPage");

    const addButton =
      document.getElementById("addTabButton");

    const collectionButton =
      document.getElementById("collectionTabButton");


    if (tabName === "collection") {

      addPage.classList.remove("active");
      detailPage.classList.remove("active");
      editPage.classList.remove("active");
      collectionPage.classList.add("active");

      addButton.classList.remove("active");
      collectionButton.classList.add("active");

      // 第一次打開收藏頁時才載入全部收藏
      if (!collectionLoaded) {

        loadCollectionList();

        collectionLoaded = true;

      }

    } else {

      collectionPage.classList.remove("active");
      detailPage.classList.remove("active");
      editPage.classList.remove("active");
      addPage.classList.add("active");

      collectionButton.classList.remove("active");
      addButton.classList.add("active");

    }

  }
let imageBase64 = "";
  let imageMimeType = "";
  let imageName = "";


  function handleImageSelect(input) {

    const file =
      input.files &&
      input.files[0];

    if (!file) {
      clearSelectedImage();
      return;
    }

    document
      .getElementById("imageInfo")
      .innerText =
      "⏳ 正在處理圖片...";

    compressImage(
      file,
      1600,
      0.82
    )
      .then(function(result) {

        imageBase64 =
          result.dataUrl
            .split(",")[1];

        imageMimeType =
          "image/jpeg";

        imageName =
          (file.name ||
            "collection-image")
            .replace(/\.[^.]+$/, "") +
          ".jpg";

        const preview =
          document.getElementById(
            "imagePreview"
          );

        preview.src =
          result.dataUrl;

        preview.style.display =
          "block";

        document
          .getElementById("imageInfo")
          .innerText =
          "✅ 圖片已準備好";

      })
      .catch(function(error) {

        console.error(error);

        clearSelectedImage();

        alert(
          "圖片處理失敗：" +
          error
        );

      });

  }


  function compressImage(
    file,
    maxSide,
    quality
  ) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();

        reader.onload =
          function(event) {

            const img =
              new Image();

            img.onload =
              function() {

                let width =
                  img.width;

                let height =
                  img.height;

                if (
                  width > maxSide ||
                  height > maxSide
                ) {

                  const scale =
                    Math.min(
                      maxSide / width,
                      maxSide / height
                    );

                  width =
                    Math.round(
                      width * scale
                    );

                  height =
                    Math.round(
                      height * scale
                    );
                }

                const canvas =
                  document.createElement(
                    "canvas"
                  );

                canvas.width =
                  width;

                canvas.height =
                  height;

                const ctx =
                  canvas.getContext("2d");

                ctx.fillStyle =
                  "#ffffff";

                ctx.fillRect(
                  0,
                  0,
                  width,
                  height
                );

                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );

                const dataUrl =
                  canvas.toDataURL(
                    "image/jpeg",
                    quality
                  );

                resolve({
                  dataUrl: dataUrl
                });

              };

            img.onerror =
              function() {
                reject(
                  "無法讀取這張圖片"
                );
              };

            img.src =
              event.target.result;
          };

        reader.onerror =
          function() {
            reject(
              "無法讀取檔案"
            );
          };

        reader.readAsDataURL(file);

      }
    );

  }


  function clearSelectedImage() {

    imageBase64 = "";
    imageMimeType = "";
    imageName = "";

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src = "";
    preview.style.display =
      "none";

    document
      .getElementById("imageInfo")
      .innerText = "";

    document
      .getElementById("imageInput")
      .value = "";

  }


  let scanner = null;


  function startScanner() {

    if (scanner) {
      return;
    }

    scanner =
      new Html5Qrcode("reader");

    scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 300,
          height: 120
        }
      },

      function(decodedText) {

        document
          .getElementById("barcode")
          .value =
          decodedText;

        scanner
          .stop()
          .then(function() {

            scanner.clear();
            scanner = null;

            searchBarcode(
              decodedText
            );

          });

      },

      function(errorMessage) {
        // 尚未辨識到條碼時不顯示
      }

    ).catch(function(error) {

      alert(
        "無法開啟相機：" +
        error
      );

      scanner = null;

    });

  }


  function searchBarcode(barcode) {

    const resultBox =
      document.getElementById(
        "searchResult"
      );

    barcode =
      String(barcode || "")
        .trim();

    if (!barcode) {

      resultBox.style.display =
        "block";

      resultBox.innerHTML =
        "⚠️ 請先輸入或掃描條碼";

      return;
    }

    resultBox.style.display =
      "block";

    resultBox.innerHTML =
      "🔍 查詢中...";

    const callbackName =
      "barcodeCallback_" +
      Date.now();

    window[callbackName] =
      function(data) {

        if (!data.success) {

          resultBox.innerHTML =
            "❌ 查詢失敗：" +
            data.error;

          cleanup();
          return;
        }

        if (!data.found) {

          resultBox.innerHTML = `
            <strong>
              🆕 尚未建立這個商品
            </strong>

            <br><br>

            條碼：${barcode}

            <br>

            可以直接在下面填寫資料新增收藏。
          `;

          cleanup();
          return;
        }

        const item =
          data.item;

let imageHtml = "";

if (item.imageUrl) {

  let imageSrc = item.imageUrl;

  // 如果是 Google Drive 圖片網址，抓出 File ID
  const idMatch =
    item.imageUrl.match(
      /(?:id=|\/d\/)([a-zA-Z0-9_-]+)/
    );

  if (idMatch) {

    const fileId =
      idMatch[1];

    imageSrc =
      "https://drive.google.com/thumbnail?id=" +
      fileId +
      "&sz=w1000";

  }

  imageHtml = `
    <img
      src="${imageSrc}"
      alt="收藏圖片"
      style="
        width:100%;
        max-height:240px;
        object-fit:contain;
        border-radius:10px;
        margin-bottom:12px;
      "
    >
  `;
}

        resultBox.innerHTML = `
          ${imageHtml}

          <strong>
            ✅ 已找到收藏
          </strong>

          <hr>

          <strong>
            ${item.name || "未命名"}
          </strong>

          <br><br>

          分類：
          ${item.category || "-"}

          <br>

          📍 位置：
          ${item.location || "-"}

          <br>

          數量：
          ${item.quantity || 1}

          <br>

          💰 價格：
          ${item.price || "-"}

          <br>

          備註：
          ${item.notes || "-"}
        `;

        cleanup();
      };

    const script =
      document.createElement(
        "script"
      );

    script.src =
      WEB_APP_URL +
      "?barcode=" +
      encodeURIComponent(
        barcode
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&t=" +
      Date.now();

    script.onerror =
      function() {

        resultBox.innerHTML =
          "❌ 無法連線到資料庫";

        cleanup();
      };

    document.body.appendChild(
      script
    );

    function cleanup() {

      if (script.parentNode) {

        script.parentNode
          .removeChild(script);
      }

      delete window[
        callbackName
      ];

    }

  }

let allItems = [];


function loadCollectionList() {

  const callbackName =
    "listCallback_" +
    Date.now();

  window[callbackName] =
    function(data) {

     if (!data.success) {

  document
    .getElementById("collectionCount")
    .innerText =
    "❌ 無法載入收藏：" +
    (data.error || "未知錯誤");

        cleanup();

        return;
      }

      allItems =
        data.items || [];

      renderCollectionList(
        allItems
      );

      cleanup();

    };


  const script =
    document.createElement("script");


  script.src =
    WEB_APP_URL +
    "?action=list" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      document
        .getElementById("collectionCount")
        .innerText =
        "❌ 無法連線到收藏資料";

      cleanup();

    };


  document.body.appendChild(
    script
  );


  function cleanup() {

    if (script.parentNode) {

      script.parentNode
        .removeChild(script);

    }

    delete window[
      callbackName
    ];

  }

}


function getDisplayImageUrl(imageUrl, size) {

  if (!imageUrl) {
    return "";
  }

  const idMatch =
    imageUrl.match(
      /(?:id=|\/d\/)([a-zA-Z0-9_-]+)/
    );

  if (idMatch) {
    return (
      "https://drive.google.com/thumbnail?id=" +
      idMatch[1] +
      "&sz=w" +
      (size || 1200)
    );
  }

  return imageUrl;
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatDateValue(value) {

  if (!value) {
    return "-";
  }

  const text =
    String(value);

  const date =
    new Date(text);

  if (isNaN(date.getTime())) {
    return text;
  }

  return date.toLocaleDateString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );
}


function showItemDetail(itemIndex) {

  const item =
    allItems[itemIndex];

  if (!item) {
    return;
  }

  document
    .getElementById("addPage")
    .classList.remove("active");

  document
    .getElementById("collectionPage")
    .classList.remove("active");

  document
    .getElementById("detailPage")
    .classList.add("active");

  document
    .getElementById("addTabButton")
    .classList.remove("active");

  document
    .getElementById("collectionTabButton")
    .classList.add("active");


  const imageSrc =
    getDisplayImageUrl(
      item.imageUrl,
      1400
    );


  const imageHtml =
    imageSrc
      ? `
        <img
          class="detail-image"
          src="${escapeHtml(imageSrc)}"
          alt="收藏圖片"
        >
      `
      : `
        <div
          class="detail-image"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:64px;
            min-height:220px;
          "
        >
          📦
        </div>

let editingItemIndex = -1;

let editImageBase64 = "";
let editImageMimeType = "";
let editImageName = "";


function toDateInputValue(value) {

  if (!value) {
    return "";
  }

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return String(value).slice(0, 10);
  }

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );
}


function openEdit(itemIndex) {

  const item =
    allItems[itemIndex];

  if (!item) {
    return;
  }

  editingItemIndex =
    itemIndex;

  editImageBase64 = "";
  editImageMimeType = "";
  editImageName = "";

  document
    .getElementById("detailPage")
    .classList.remove("active");

  document
    .getElementById("editPage")
    .classList.add("active");


  const currentImageSrc =
    getDisplayImageUrl(
      item.imageUrl,
      1200
    );

  document
    .getElementById("editCurrentImage")
    .innerHTML =
      currentImageSrc
        ? `
          <img
            class="edit-image-current"
            src="${escapeHtml(currentImageSrc)}"
            alt="目前圖片"
          >
        `
        : `
          <div
            class="edit-image-current"
            style="
              min-height:180px;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:56px;
            "
          >
            📦
          </div>
        `;


  document
    .getElementById("editImageInput")
    .value = "";

  const newPreview =
    document.getElementById(
      "editImagePreview"
    );

  newPreview.src = "";
  newPreview.style.display =
    "none";

  document
    .getElementById("editImageInfo")
    .innerText =
    "不選新圖片就會保留目前圖片";


  document.getElementById(
    "editName"
  ).value =
    item.name || "";

  document.getElementById(
    "editCategory"
  ).value =
    item.category || "";

  document.getElementById(
    "editLocation"
  ).value =
    item.location || "";

  document.getElementById(
    "editQuantity"
  ).value =
    item.quantity || 1;

  document.getElementById(
    "editPurchaseDate"
  ).value =
    toDateInputValue(
      item.purchaseDate
    );

  document.getElementById(
    "editPrice"
  ).value =
    item.price || "";

  document.getElementById(
    "editNotes"
  ).value =
    item.notes || "";

  document.getElementById(
    "editBarcode"
  ).value =
    item.barcode || "";

  document.getElementById(
    "editMessage"
  ).innerText = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function handleEditImageSelect(input) {

  const file =
    input.files &&
    input.files[0];

  if (!file) {

    editImageBase64 = "";
    editImageMimeType = "";
    editImageName = "";

    document
      .getElementById("editImageInfo")
      .innerText =
      "不選新圖片就會保留目前圖片";

    return;
  }

  document
    .getElementById("editImageInfo")
    .innerText =
    "⏳ 正在處理新圖片...";


  compressImage(
    file,
    1600,
    0.82
  )
    .then(function(result) {

      editImageBase64 =
        result.dataUrl
          .split(",")[1];

      editImageMimeType =
        "image/jpeg";

      editImageName =
        (file.name ||
          "collection-image")
          .replace(/\.[^.]+$/, "") +
        ".jpg";

      const preview =
        document.getElementById(
          "editImagePreview"
        );

      preview.src =
        result.dataUrl;

      preview.style.display =
        "block";

      document
        .getElementById("editImageInfo")
        .innerText =
        "✅ 新圖片已準備好";

    })
    .catch(function(error) {

      console.error(error);

      editImageBase64 = "";
      editImageMimeType = "";
      editImageName = "";

      alert(
        "圖片處理失敗：" +
        error
      );

    });
}


function cancelEdit() {

  document
    .getElementById("editPage")
    .classList.remove("active");

  document
    .getElementById("detailPage")
    .classList.add("active");
}


async function saveEdit() {

  const item =
    allItems[editingItemIndex];

  if (!item) {
    alert("找不到要修改的收藏");
    return;
  }

  const name =
    document
      .getElementById("editName")
      .value
      .trim();

  if (!name) {
    alert("請輸入收藏名稱");
    return;
  }


  const data = {

    action: "update",

    id:
      item.id,

    name:
      name,

    category:
      document
        .getElementById("editCategory")
        .value
        .trim(),

    location:
      document
        .getElementById("editLocation")
        .value
        .trim(),

    quantity:
      document
        .getElementById("editQuantity")
        .value,

    purchaseDate:
      document
        .getElementById("editPurchaseDate")
        .value,

    price:
      document
        .getElementById("editPrice")
        .value,

    notes:
      document
        .getElementById("editNotes")
        .value
        .trim(),

    barcode:
      document
        .getElementById("editBarcode")
        .value
        .trim(),

    imageBase64:
      editImageBase64,

    imageMimeType:
      editImageMimeType,

    imageName:
      editImageName
  };


  const message =
    document.getElementById(
      "editMessage"
    );

  const button =
    document.getElementById(
      "editSaveButton"
    );

  message.innerText =
    editImageBase64
      ? "⏳ 正在上傳新圖片並儲存修改..."
      : "⏳ 正在儲存修改...";

  button.disabled = true;


  try {

    await fetch(
      WEB_APP_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


    message.innerText =
      "✅ 修改已送出！";


    // 給 Apps Script 一點時間寫入 Sheet，再重新抓最新資料
    await new Promise(
      function(resolve) {
        setTimeout(resolve, 1200);
      }
    );


    collectionLoaded = true;

    await reloadCollectionAfterEdit(
      item.id
    );


  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ 修改失敗";

  } finally {

    button.disabled =
      false;
  }
}


function reloadCollectionAfterEdit(itemId) {

  return new Promise(
    function(resolve) {

      const callbackName =
        "editReloadCallback_" +
        Date.now();

      window[callbackName] =
        function(data) {

          if (
            data.success &&
            Array.isArray(data.items)
          ) {

            allItems =
              data.items;

            renderCollectionList(
              allItems
            );

            const newIndex =
              allItems.findIndex(
                function(item) {
                  return (
                    String(item.id) ===
                    String(itemId)
                  );
                }
              );

            document
              .getElementById("editPage")
              .classList.remove("active");

            if (newIndex >= 0) {
              showItemDetail(
                newIndex
              );
            } else {
              document
                .getElementById("collectionPage")
                .classList.add("active");
            }
          }

          cleanup();
          resolve();
        };


      const script =
        document.createElement(
          "script"
        );

      script.src =
        WEB_APP_URL +
        "?action=list" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();

      script.onerror =
        function() {

          cleanup();
          resolve();

          alert(
            "修改可能已完成，但重新載入收藏失敗，請重新整理頁面。"
          );
        };

      document.body.appendChild(
        script
      );


      function cleanup() {

        if (script.parentNode) {
          script.parentNode
            .removeChild(script);
        }

        delete window[
          callbackName
        ];
      }

    }
  );
}


function backToCollection() {

  document

  document

    .getElementById("addTabButton")

}

function renderCollectionList(items) {

  const list =
    document.getElementById(
      "collectionList"
    );

  const count =
    document.getElementById(
      "collectionCount"
    );


  count.innerText =
    "目前共有 " +
    items.length +
    " 件收藏";


  if (items.length === 0) {

    list.innerHTML =
      '<div class="empty-list-message">沒有符合的收藏</div>';

    return;
  }


  let html = "";


  items.forEach(function(item) {

    const imageSrc =
      getDisplayImageUrl(
        item.imageUrl,
        500
      );


    const imageHtml =
      imageSrc
        ? `
          <img
            src="${escapeHtml(imageSrc)}"
            alt="收藏圖片"
          >
        `
        : `
          <div class="collection-placeholder">
            📦
          </div>
        `;


    const realIndex =
      allItems.indexOf(item);


    html += `

      <div
        class="collection-item"
        onclick="showItemDetail(${realIndex})"
      >

        ${imageHtml}

        <div class="collection-info">

          <div class="collection-name">
            ${escapeHtml(item.name || "未命名")}
          </div>

          <div class="collection-meta">

            ${
              item.category
                ? "分類：" +
                  escapeHtml(item.category) +
                  "<br>"
                : ""
            }

            ${
              item.location
                ? "📍 " +
                  escapeHtml(item.location) +
                  "<br>"
                : ""
            }

            數量：
            ${escapeHtml(item.quantity || 1)}

            ${
              item.price
                ? "<br>💰 " +
                  escapeHtml(item.price)
                : ""
            }

          </div>

        </div>

      </div>

    `;

  });


  list.innerHTML =
    html;
}

function filterCollectionList() {

  const keyword =
    document
      .getElementById(
        "textSearch"
      )
      .value
      .trim()
      .toLowerCase();


  if (!keyword) {

    renderCollectionList(
      allItems
    );

    return;

  }


  const filtered =
    allItems.filter(
      function(item) {

        const text = [
          item.name,
          item.category,
          item.location,
          item.notes,
          item.barcode
        ]
          .join(" ")
          .toLowerCase();


        return text.includes(
          keyword
        );

      }
    );


  renderCollectionList(
    filtered
  );

}
