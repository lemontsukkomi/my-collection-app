<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>我的收藏</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #scanButton {
      background: #eeeeee;
    }

    #saveButton {
      margin-top: 25px;
    }

    #reader {
      margin-top: 15px;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    #imagePreview {
      display: none;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    #imageInfo {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }

    #searchResult img {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📦 我的收藏</h1>

  <label>主圖片</label>

  <input
    id="imageInput"
    type="file"
    accept="image/*"
    onchange="handleImageSelect(this)"
  >

  <img
    id="imagePreview"
    alt="圖片預覽"
  >

  <div id="imageInfo"></div>

  <label>條碼</label>

  <input
    id="barcode"
    type="text"
    placeholder="掃描或手動輸入條碼"
  >

  <button
    type="button"
    onclick="searchBarcode(
      document.getElementById('barcode').value
    )"
  >
    🔍 搜尋條碼
  </button>

  <button
    id="scanButton"
    type="button"
    onclick="startScanner()"
  >
    📷 掃描條碼
  </button>

  <div id="reader"></div>

  <div
    id="searchResult"
    style="
      margin-top:15px;
      padding:15px;
      border-radius:10px;
      display:none;
    "
  ></div>

  <label>收藏名稱 *</label>

  <input
    id="name"
    type="text"
    placeholder="例如：寶可夢卡盒"
  >

  <label>分類</label>

  <input
    id="category"
    type="text"
    placeholder="例如：寶可夢"
  >

  <label>存放位置</label>

  <input
    id="location"
    type="text"
    placeholder="例如：防潮箱第一層"
  >

  <label>數量</label>

  <input
    id="quantity"
    type="number"
    value="1"
    min="1"
  >

  <label>購買日期</label>

  <input
    id="purchaseDate"
    type="date"
  >

  <label>購入價格</label>

  <input
    id="price"
    type="number"
    placeholder="例如：500"
  >

  <label>備註</label>

  <textarea
    id="notes"
    rows="4"
    placeholder="其他想記錄的內容"
  ></textarea>

  <button
    id="saveButton"
    type="button"
    onclick="saveItem()"
  >
    💾 儲存收藏
  </button>

  <div id="message"></div>

</div>


<script>

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycby6fpsy6FRKllxp2k5yEM0MWsV3ShzvrdE7Ug8kBEIFzMHd8vQmR_lcXbDbFhqZaUde/exec";


  let imageBase64 = "";
  let imageMimeType = "";
  let imageName = "";


  function handleImageSelect(input) {

    const file =
      input.files &&
      input.files[0];

    if (!file) {
      clearSelectedImage();
      return;
    }

    document
      .getElementById("imageInfo")
      .innerText =
      "⏳ 正在處理圖片...";

    compressImage(
      file,
      1600,
      0.82
    )
      .then(function(result) {

        imageBase64 =
          result.dataUrl
            .split(",")[1];

        imageMimeType =
          "image/jpeg";

        imageName =
          (file.name ||
            "collection-image")
            .replace(/\.[^.]+$/, "") +
          ".jpg";

        const preview =
          document.getElementById(
            "imagePreview"
          );

        preview.src =
          result.dataUrl;

        preview.style.display =
          "block";

        document
          .getElementById("imageInfo")
          .innerText =
          "✅ 圖片已準備好";

      })
      .catch(function(error) {

        console.error(error);

        clearSelectedImage();

        alert(
          "圖片處理失敗：" +
          error
        );

      });

  }


  function compressImage(
    file,
    maxSide,
    quality
  ) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();

        reader.onload =
          function(event) {

            const img =
              new Image();

            img.onload =
              function() {

                let width =
                  img.width;

                let height =
                  img.height;

                if (
                  width > maxSide ||
                  height > maxSide
                ) {

                  const scale =
                    Math.min(
                      maxSide / width,
                      maxSide / height
                    );

                  width =
                    Math.round(
                      width * scale
                    );

                  height =
                    Math.round(
                      height * scale
                    );
                }

                const canvas =
                  document.createElement(
                    "canvas"
                  );

                canvas.width =
                  width;

                canvas.height =
                  height;

                const ctx =
                  canvas.getContext("2d");

                ctx.fillStyle =
                  "#ffffff";

                ctx.fillRect(
                  0,
                  0,
                  width,
                  height
                );

                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );

                const dataUrl =
                  canvas.toDataURL(
                    "image/jpeg",
                    quality
                  );

                resolve({
                  dataUrl: dataUrl
                });

              };

            img.onerror =
              function() {
                reject(
                  "無法讀取這張圖片"
                );
              };

            img.src =
              event.target.result;
          };

        reader.onerror =
          function() {
            reject(
              "無法讀取檔案"
            );
          };

        reader.readAsDataURL(file);

      }
    );

  }


  function clearSelectedImage() {

    imageBase64 = "";
    imageMimeType = "";
    imageName = "";

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src = "";
    preview.style.display =
      "none";

    document
      .getElementById("imageInfo")
      .innerText = "";

    document
      .getElementById("imageInput")
      .value = "";

  }


  let scanner = null;


  function startScanner() {

    if (scanner) {
      return;
    }

    scanner =
      new Html5Qrcode("reader");

    scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 300,
          height: 120
        }
      },

      function(decodedText) {

        document
          .getElementById("barcode")
          .value =
          decodedText;

        scanner
          .stop()
          .then(function() {

            scanner.clear();
            scanner = null;

            searchBarcode(
              decodedText
            );

          });

      },

      function(errorMessage) {
        // 尚未辨識到條碼時不顯示
      }

    ).catch(function(error) {

      alert(
        "無法開啟相機：" +
        error
      );

      scanner = null;

    });

  }


  function searchBarcode(barcode) {

    const resultBox =
      document.getElementById(
        "searchResult"
      );

    barcode =
      String(barcode || "")
        .trim();

    if (!barcode) {

      resultBox.style.display =
        "block";

      resultBox.innerHTML =
        "⚠️ 請先輸入或掃描條碼";

      return;
    }

    resultBox.style.display =
      "block";

    resultBox.innerHTML =
      "🔍 查詢中...";

    const callbackName =
      "barcodeCallback_" +
      Date.now();

    window[callbackName] =
      function(data) {

        if (!data.success) {

          resultBox.innerHTML =
            "❌ 查詢失敗：" +
            data.error;

          cleanup();
          return;
        }

        if (!data.found) {

          resultBox.innerHTML = `
            <strong>
              🆕 尚未建立這個商品
            </strong>

            <br><br>

            條碼：${barcode}

            <br>

            可以直接在下面填寫資料新增收藏。
          `;

          cleanup();
          return;
        }

        const item =
          data.item;

let imageHtml = "";

if (item.imageUrl) {

  let imageSrc = item.imageUrl;

  // 如果是 Google Drive 圖片網址，抓出 File ID
  const idMatch =
    item.imageUrl.match(
      /(?:id=|\/d\/)([a-zA-Z0-9_-]+)/
    );

  if (idMatch) {

    const fileId =
      idMatch[1];

    imageSrc =
      "https://drive.google.com/thumbnail?id=" +
      fileId +
      "&sz=w1000";

  }

  imageHtml = `
    <img
      src="${imageSrc}"
      alt="收藏圖片"
      style="
        width:100%;
        max-height:240px;
        object-fit:contain;
        border-radius:10px;
        margin-bottom:12px;
      "
    >
  `;
}

        resultBox.innerHTML = `
          ${imageHtml}

          <strong>
            ✅ 已找到收藏
          </strong>

          <hr>

          <strong>
            ${item.name || "未命名"}
          </strong>

          <br><br>

          分類：
          ${item.category || "-"}

          <br>

          📍 位置：
          ${item.location || "-"}

          <br>

          數量：
          ${item.quantity || 1}

          <br>

          💰 價格：
          ${item.price || "-"}

          <br>

          備註：
          ${item.notes || "-"}
        `;

        cleanup();
      };

    const script =
      document.createElement(
        "script"
      );

    script.src =
      WEB_APP_URL +
      "?barcode=" +
      encodeURIComponent(
        barcode
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&t=" +
      Date.now();

    script.onerror =
      function() {

        resultBox.innerHTML =
          "❌ 無法連線到資料庫";

        cleanup();
      };

    document.body.appendChild(
      script
    );

    function cleanup() {

      if (script.parentNode) {

        script.parentNode
          .removeChild(script);
      }

      delete window[
        callbackName
      ];

    }

  }


  async function saveItem() {

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    if (!name) {
      alert(
        "請輸入收藏名稱"
      );
      return;
    }

    const data = {

      name:
        name,

      category:
        document
          .getElementById(
            "category"
          )
          .value
          .trim(),

      location:
        document
          .getElementById(
            "location"
          )
          .value
          .trim(),

      quantity:
        document
          .getElementById(
            "quantity"
          )
          .value,

      purchaseDate:
        document
          .getElementById(
            "purchaseDate"
          )
          .value,

      price:
        document
          .getElementById(
            "price"
          )
          .value,

      notes:
        document
          .getElementById(
            "notes"
          )
          .value
          .trim(),

      barcode:
        document
          .getElementById(
            "barcode"
          )
          .value
          .trim(),

      imageBase64:
        imageBase64,

      imageMimeType:
        imageMimeType,

      imageName:
        imageName
    };

    const message =
      document.getElementById(
        "message"
      );

    const button =
      document.getElementById(
        "saveButton"
      );

    message.innerText =
      imageBase64
        ? "⏳ 正在上傳圖片並儲存..."
        : "⏳ 儲存中...";

    button.disabled = true;

    try {

      await fetch(

        WEB_APP_URL,

        {
          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data)
        }

      );

      message.innerText =
        "✅ 資料已送出！";

      clearForm();

    } catch (error) {

      console.error(error);

      message.innerText =
        "❌ 儲存失敗";

    } finally {

      button.disabled =
        false;
    }

  }


  function clearForm() {

    clearSelectedImage();

    document.getElementById(
      "barcode"
    ).value = "";

    document.getElementById(
      "name"
    ).value = "";

    document.getElementById(
      "category"
    ).value = "";

    document.getElementById(
      "location"
    ).value = "";

    document.getElementById(
      "quantity"
    ).value = 1;

    document.getElementById(
      "purchaseDate"
    ).value = "";

    document.getElementById(
      "price"
    ).value = "";

    document.getElementById(
      "notes"
    ).value = "";

    const resultBox =
      document.getElementById(
        "searchResult"
      );

    resultBox.style.display =
      "none";

    resultBox.innerHTML =
      "";

  }

</script>

</body>
</html>
