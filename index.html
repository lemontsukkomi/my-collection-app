<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>我的收藏</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    .collection-item {
  background: #ffffff;
  border: 1px solid #dddddd;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;

  display: flex;
  gap: 12px;
  align-items: center;
}

.collection-item img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 10px;
  background: #eeeeee;
  flex-shrink: 0;
}

.collection-info {
  flex: 1;
}

.collection-name {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 6px;
}

.collection-meta {
  font-size: 14px;
  color: #666;
  line-height: 1.6;
}
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #scanButton {
      background: #eeeeee;
    }

    #saveButton {
      margin-top: 25px;
    }

    #reader {
      margin-top: 15px;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    #imagePreview {
      display: none;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    #imageInfo {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }

    #searchResult img {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-button {
      flex: 1;
      margin-top: 0;
      background: #eeeeee;
      font-weight: bold;
    }

    .tab-button.active {
      background: #dcdcdc;
    }

    .tab-page {
      display: none;
    }

    .tab-page.active {
      display: block;
    }


    .collection-item {
      cursor: pointer;
    }

    .collection-item:active {
      transform: scale(0.995);
    }

    .detail-back-button {
      margin-top: 0;
      margin-bottom: 16px;
      background: #eeeeee;
    }

    .detail-image {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
      background: #f1f1f1;
      margin-bottom: 18px;
    }

    .detail-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid #eeeeee;
      line-height: 1.5;
      word-break: break-word;
    }

    .detail-label {
      font-weight: bold;
      color: #555;
      display: block;
      margin-bottom: 4px;
    }

    .detail-empty {
      color: #999;
    }


    /* 收藏頁：三欄圖片格狀顯示 */
    #collectionList {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    #collectionList .collection-item {
      display: block;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      background: #eeeeee;
      box-shadow: none;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    #collectionList .collection-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 0;
      background: #eeeeee;
    }

    #collectionList .collection-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: #eeeeee;
    }

    #collectionList .collection-info {
      display: none;
    }

    #collectionList .empty-list-message {
      grid-column: 1 / -1;
      text-align: center;
      color: #888;
      padding: 20px 0;
    }


    .detail-actions {
      margin-top: 22px;
    }

    .edit-button {
      background: #eeeeee;
      font-weight: bold;
    }

    .edit-image-current {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 10px;
      background: #f1f1f1;
      margin-top: 10px;
    }

    #editImagePreview {
      display: none;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    #editImageInfo,
    #editMessage {
      margin-top: 10px;
      text-align: center;
      color: #666;
    }

    #editSaveButton {
      margin-top: 25px;
      font-weight: bold;
    }


    /* 條碼按鈕同一排 */
    .barcode-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .barcode-actions button {
      flex: 1;
      width: auto;
      margin-top: 0;
      padding: 13px 10px;
      font-size: 16px;
    }

    /* iPhone 日期欄避免超出卡片 */
    input[type="date"] {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    /* 分類篩選 */
    .collection-filter-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .collection-filter-row select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    .delete-button {
      background: #f3f3f3;
      font-weight: bold;
      margin-top: 10px;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .detail-actions button {
      margin-top: 0;
    }


    /* 金額 + 幣種並排 */
    .price-currency-row {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(120px, 1fr);
      gap: 10px;
      align-items: end;
    }

    .price-currency-row > div {
      min-width: 0;
    }

    .price-currency-row input,
    .price-currency-row select {
      width: 100%;
      box-sizing: border-box;
    }

    .currency-select {
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    .currency-manage-button {
      margin-top: 8px;
      padding: 9px 10px;
      font-size: 14px;
      background: #eeeeee;
    }

    .currency-manager {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      background: #fafafa;
    }

    .currency-manager.active {
      display: block;
    }

    .currency-manager-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
    }

    .currency-manager-row input {
      margin-top: 0;
    }

    .currency-manager-actions {
      display: flex;
      gap: 8px;
    }

    .currency-manager-actions button {
      margin-top: 10px;
      padding: 10px;
      font-size: 15px;
    }

    .custom-currency-list {
      margin-top: 12px;
    }

    .custom-currency-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .custom-currency-item button {
      width: auto;
      margin-top: 0;
      padding: 7px 10px;
      font-size: 13px;
    }

    @media (max-width: 380px) {
      .price-currency-row {
        grid-template-columns: minmax(0, 1.45fr) minmax(105px, 1fr);
        gap: 8px;
      }
    }


    /* 高速掃描器提示 */
    .scanner-hint {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f3f3f3;
      font-size: 14px;
      line-height: 1.5;
      color: #555;
      text-align: center;
    }

    .scanner-hint.active {
      display: block;
    }

    #reader {
      overflow: hidden;
      border-radius: 10px;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>📦 我的收藏</h1>

  <div class="tabs">
    <button
      id="addTabButton"
      class="tab-button active"
      type="button"
      onclick="showTab('add')"
    >
      ➕ 新增物品
    </button>

    <button
      id="collectionTabButton"
      class="tab-button"
      type="button"
      onclick="showTab('collection')"
    >
      📚 我的收藏
    </button>
  </div>

  <!-- =========================
       新增物品頁（預設首頁）
  ========================== -->
  <div
    id="addPage"
    class="tab-page active"
  >

    <label>主圖片</label>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      onchange="handleImageSelect(this)"
    >

    <img
      id="imagePreview"
      alt="圖片預覽"
    >

    <div id="imageInfo"></div>

    <label>條碼</label>

    <input
      id="barcode"
      type="text"
      placeholder="掃描或手動輸入條碼"
    >

    <div class="barcode-actions">

      <button
        type="button"
        onclick="searchBarcode(
          document.getElementById('barcode').value
        )"
      >
        🔍 搜尋條碼
      </button>

      <button
        id="scanButton"
        type="button"
        onclick="startScanner()"
      >
        📷 掃描條碼
      </button>

    </div>

    <div id="reader"></div>

    <div
      id="scannerHint"
      class="scanner-hint"
    >
      對準條碼或 QR Code 中央，保持畫面清楚即可。<br>
      支援 EAN / UPC / Code 128 / Code 39 / ITF / QR Code
    </div>

    <div
      id="searchResult"
      style="
        margin-top:15px;
        padding:15px;
        border-radius:10px;
        display:none;
      "
    ></div>

    <label>收藏名稱 *</label>

    <input
      id="name"
      type="text"
      placeholder="例如：寶可夢卡盒"
    >

    <label>分類</label>

    <input
      id="category"
      type="text"
      placeholder="例如：寶可夢"
    >

    <label>存放位置</label>

    <input
      id="location"
      type="text"
      placeholder="例如：防潮箱第一層"
    >

    <label>數量</label>

    <input
      id="quantity"
      type="number"
      value="1"
      min="1"
    >

    <label>購買日期</label>

    <input
      id="purchaseDate"
      type="date"
    >

    <div class="price-currency-row">

      <div>
        <label>購入價格</label>
        <input
          id="price"
          type="number"
          placeholder="例如：500"
        >
      </div>

      <div>
        <label>幣種</label>
        <select
          id="currency"
          class="currency-select"
        ></select>
      </div>

    </div>

    <button
      type="button"
      class="currency-manage-button"
      onclick="toggleCurrencyManager()"
    >
      ⚙️ 管理幣種
    </button>

    <div
      id="currencyManager"
      class="currency-manager"
    >
      <strong>自訂幣種</strong>

      <div
        class="currency-manager-row"
        style="margin-top:10px;"
      >
        <input
          id="newCurrencyCode"
          type="text"
          maxlength="8"
          placeholder="代碼，如 KRW"
        >

        <input
          id="newCurrencyName"
          type="text"
          maxlength="20"
          placeholder="名稱，如 韓元"
        >
      </div>

      <div class="currency-manager-actions">

        <button
          type="button"
          onclick="addCustomCurrency()"
        >
          ＋ 新增幣種
        </button>

        <button
          type="button"
          onclick="toggleCurrencyManager(false)"
        >
          關閉
        </button>

      </div>

      <div
        id="customCurrencyList"
        class="custom-currency-list"
      ></div>
    </div>

    <label>備註</label>

    <textarea
      id="notes"
      rows="4"
      placeholder="其他想記錄的內容"
    ></textarea>

    <button
      id="saveButton"
      type="button"
      onclick="saveItem()"
    >
      💾 儲存收藏
    </button>

    <div id="message"></div>

  </div>

  <!-- =========================
       我的收藏頁
  ========================== -->
  <div
    id="collectionPage"
    class="tab-page"
  >

    <div
      id="collectionCount"
      style="
        text-align:center;
        margin-bottom:12px;
        color:#666;
      "
    >
      尚未載入收藏
    </div>

    <input
      id="textSearch"
      type="text"
      placeholder="搜尋名稱、分類、位置、備註..."
      oninput="filterCollectionList()"
    >

    <div class="collection-filter-row">
      <select
        id="categoryFilter"
        onchange="filterCollectionList()"
      >
        <option value="">全部分類</option>
      </select>
    </div>

    <div
      id="collectionList"
      style="margin-top:15px;"
    ></div>

  </div>

  <div
    id="detailPage"
    class="tab-page"
  >
    <button
      type="button"
      class="detail-back-button"
      onclick="backToCollection()"
    >
      ← 返回我的收藏
    </button>

    <div id="detailContent"></div>
  </div>

  <div
    id="editPage"
    class="tab-page"
  >
    <button
      type="button"
      class="detail-back-button"
      onclick="cancelEdit()"
    >
      ← 取消編輯
    </button>

    <h2>✏️ 編輯收藏</h2>

    <label>目前圖片</label>
    <div id="editCurrentImage"></div>

    <label>更換圖片（可不選）</label>
    <input
      id="editImageInput"
      type="file"
      accept="image/*"
      onchange="handleEditImageSelect(this)"
    >

    <img
      id="editImagePreview"
      alt="新圖片預覽"
    >

    <div id="editImageInfo"></div>

    <label>收藏名稱 *</label>
    <input id="editName" type="text">

    <label>分類</label>
    <input id="editCategory" type="text">

    <label>存放位置</label>
    <input id="editLocation" type="text">

    <label>數量</label>
    <input
      id="editQuantity"
      type="number"
      min="1"
      value="1"
    >

    <label>購買日期</label>
    <input
      id="editPurchaseDate"
      type="date"
    >

    <div class="price-currency-row">

      <div>
        <label>購入價格</label>
        <input
          id="editPrice"
          type="number"
        >
      </div>

      <div>
        <label>幣種</label>
        <select
          id="editCurrency"
          class="currency-select"
        ></select>
      </div>

    </div>

    <label>備註</label>
    <textarea
      id="editNotes"
      rows="4"
    ></textarea>

    <label>條碼</label>
    <input
      id="editBarcode"
      type="text"
    >

    <button
      id="editSaveButton"
      type="button"
      onclick="saveEdit()"
    >
      💾 儲存修改
    </button>

    <div id="editMessage"></div>
  </div>

</div>


<script>

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbwcqg5ZB7Z2o31eccT6jZ1x1ktzGJ5rDxW8k9hLpB9n_L5nxeM1rZewqqmlws-YPuWG/exec";


  

  let collectionLoaded = false;


  const BUILTIN_CURRENCIES = [
    { code: "TWD", name: "台幣" },
    { code: "JPY", name: "日幣" },
    { code: "USD", name: "美金" }
  ];

  const CUSTOM_CURRENCY_KEY =
    "myCollectionCustomCurrencies";


  function getCustomCurrencies() {

    try {

      const raw =
        localStorage.getItem(
          CUSTOM_CURRENCY_KEY
        );

      const parsed =
        raw
          ? JSON.parse(raw)
          : [];

      return Array.isArray(parsed)
        ? parsed
        : [];

    } catch (error) {

      console.error(error);

      return [];
    }
  }


  function saveCustomCurrencies(list) {

    localStorage.setItem(
      CUSTOM_CURRENCY_KEY,
      JSON.stringify(list)
    );
  }


  function getAllCurrencies() {

    const seen =
      new Set();

    return BUILTIN_CURRENCIES
      .concat(
        getCustomCurrencies()
      )
      .filter(function(item) {

        const code =
          String(item.code || "")
            .trim()
            .toUpperCase();

        if (
          !code ||
          seen.has(code)
        ) {
          return false;
        }

        seen.add(code);

        return true;
      })
      .map(function(item) {

        return {
          code:
            String(item.code || "")
              .trim()
              .toUpperCase(),

          name:
            String(item.name || "")
              .trim()
        };
      });
  }


  function currencyLabel(code) {

    const normalized =
      String(code || "TWD")
        .trim()
        .toUpperCase() ||
      "TWD";

    const found =
      getAllCurrencies()
        .find(function(item) {
          return (
            item.code ===
            normalized
          );
        });

    return found
      ? (
          found.code +
          (found.name
            ? " " + found.name
            : "")
        )
      : normalized;
  }


  function populateCurrencySelects() {

    const selects = [
      document.getElementById(
        "currency"
      ),
      document.getElementById(
        "editCurrency"
      )
    ].filter(Boolean);

    const currencies =
      getAllCurrencies();

    selects.forEach(function(select) {

      const current =
        String(
          select.value ||
          "TWD"
        )
          .trim()
          .toUpperCase();

      select.innerHTML = "";

      currencies.forEach(
        function(item) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            item.code;

          option.textContent =
            item.code +
            (item.name
              ? " " + item.name
              : "");

          select.appendChild(
            option
          );
        }
      );

      const exists =
        currencies.some(
          function(item) {
            return (
              item.code ===
              current
            );
          }
        );

      select.value =
        exists
          ? current
          : "TWD";
    });

    renderCustomCurrencyList();
  }


  function toggleCurrencyManager(forceState) {

    const manager =
      document.getElementById(
        "currencyManager"
      );

    if (!manager) {
      return;
    }

    const shouldOpen =
      typeof forceState ===
      "boolean"
        ? forceState
        : !manager.classList
            .contains("active");

    manager.classList.toggle(
      "active",
      shouldOpen
    );

    if (shouldOpen) {
      renderCustomCurrencyList();
    }
  }


  function addCustomCurrency() {

    const codeInput =
      document.getElementById(
        "newCurrencyCode"
      );

    const nameInput =
      document.getElementById(
        "newCurrencyName"
      );

    const code =
      String(
        codeInput.value || ""
      )
        .trim()
        .toUpperCase();

    const name =
      String(
        nameInput.value || ""
      ).trim();


    if (!code) {
      alert("請輸入幣種代碼");
      return;
    }

    if (
      !/^[A-Z0-9_-]{2,8}$/
        .test(code)
    ) {
      alert(
        "幣種代碼請使用 2～8 位英文字母、數字、_ 或 -"
      );
      return;
    }


    const all =
      getAllCurrencies();

    if (
      all.some(
        function(item) {
          return item.code === code;
        }
      )
    ) {
      alert(
        code +
        " 已經存在"
      );
      return;
    }


    const custom =
      getCustomCurrencies();

    custom.push({
      code: code,
      name: name
    });

    saveCustomCurrencies(
      custom
    );

    codeInput.value = "";
    nameInput.value = "";

    populateCurrencySelects();

    const addSelect =
      document.getElementById(
        "currency"
      );

    if (addSelect) {
      addSelect.value = code;
    }
  }


  function deleteCustomCurrency(code) {

    const normalized =
      String(code || "")
        .trim()
        .toUpperCase();

    if (
      BUILTIN_CURRENCIES
        .some(function(item) {
          return (
            item.code ===
            normalized
          );
        })
    ) {
      alert(
        "系統內建幣種不能刪除"
      );
      return;
    }


    const confirmed =
      confirm(
        "確定從選單刪除 " +
        normalized +
        " 嗎？\n\n已經使用這個幣種的收藏仍會保留原代碼。"
      );

    if (!confirmed) {
      return;
    }


    const custom =
      getCustomCurrencies()
        .filter(function(item) {
          return (
            String(
              item.code || ""
            )
              .trim()
              .toUpperCase() !==
            normalized
          );
        });

    saveCustomCurrencies(
      custom
    );

  function compressImage(
    file,
    maxSide,
    quality
  ) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();

        reader.onload =
          function(event) {

            const img =
              new Image();

            img.onload =
              function() {

                let width =
                  img.width;

                let height =
                  img.height;

                if (
                  width > maxSide ||
                  height > maxSide
                ) {

                  const scale =
                    Math.min(
                      maxSide / width,
                      maxSide / height
                    );

                  width =
                    Math.round(
                      width * scale
                    );

                  height =
                    Math.round(
                      height * scale
                    );
                }

                const canvas =
                  document.createElement(
                    "canvas"
                  );

                canvas.width =
                  width;

                canvas.height =
                  height;

                const ctx =
                  canvas.getContext("2d");

                ctx.fillStyle =
                  "#ffffff";

                ctx.fillRect(
                  0,
                  0,
                  width,
                  height
                );

                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );

                const dataUrl =
                  canvas.toDataURL(
                    "image/jpeg",
                    quality
                  );

                resolve({
                  dataUrl: dataUrl
                });

              };

            img.onerror =
              function() {
                reject(
                  "無法讀取這張圖片"
                );
              };

            img.src =
              event.target.result;
          };

        reader.onerror =
          function() {
            reject(
              "無法讀取檔案"
            );
          };

        reader.readAsDataURL(file);

      }
    );

  }

  function playScanBeep() {

    try {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      const audioContext =
        new AudioContextClass();

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.value =
        880;

      gain.gain.setValueAtTime(
        0.08,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.09
      );

      oscillator.connect(gain);
      gain.connect(
        audioContext.destination
      );

      oscillator.start();
      oscillator.stop(
        audioContext.currentTime + 0.09
      );

      oscillator.onended =
        function() {
          audioContext.close();
        };

    } catch (error) {

      // 某些手機瀏覽器不允許自動播放聲音，忽略即可。
      console.log(
        "掃碼提示音無法播放",
        error
      );
    }
  }

        [70, 40, 70]
      );
    }

    playScanBeep();
  }


  function getFastScannerFormats() {

    const formats = [];

    if (
      typeof Html5QrcodeSupportedFormats ===
      "undefined"
    ) {
      return formats;
    }

    const wanted = [
      "QR_CODE",
      "EAN_13",
      "EAN_8",
      "UPC_A",
      "UPC_E",
      "CODE_128",
      "CODE_39",
      "ITF"
    ];

    wanted.forEach(
      function(name) {

        if (
          Html5QrcodeSupportedFormats[
            name
          ] !== undefined
        ) {
          formats.push(
            Html5QrcodeSupportedFormats[
              name
            ]
          );
        }

      }
    );

    return formats;
  }


  async function startScanner() {

    if (scanner) {
      return;
    }

    scanResultLocked =
      false;

    const scanButton =
      document.getElementById(
        "scanButton"
      );

    const hint =
      document.getElementById(
        "scannerHint"
      );

    scanButton.disabled =
      true;

    scanButton.innerText =
      "📷 相機啟動中...";

    hint.classList.add(
      "active"
    );


    const formats =
      getFastScannerFormats();

    try {

      scanner =
        formats.length > 0
          ? new Html5Qrcode(
              "reader",
              {
                formatsToSupport:
                  formats
              }
            )
          : new Html5Qrcode(
              "reader"
            );


      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {
          // 原本 10fps，提高到 20fps。
          fps: 20,

          // 寬一點的掃描區，比較適合商品一維條碼，
          // 同時保留足夠高度讓 QR Code 也能辨識。
          qrbox:
            function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const width =
                Math.max(
                  240,
                  Math.floor(
                    viewfinderWidth *
                    0.92
                  )
                );

              const height =
                Math.min(
                  Math.floor(
                    viewfinderHeight *
                    0.62
                  ),
                  280
                );

              return {
                width:
                  Math.min(
                    width,
                    viewfinderWidth
                  ),

                height:
                  Math.max(
                    160,
                    height
                  )
              };
            },

          aspectRatio:
            1.777778,

          disableFlip:
            false
        },

        async function(
          decodedText
        ) {

          // 防止同一個條碼在 stop() 前連續觸發多次。
          if (
            scanResultLocked
          ) {
            return;
          }

          scanResultLocked =
            true;

          document
            .getElementById(
              "barcode"
            )
            .value =
            decodedText;

          scanSuccessFeedback();

          try {

            if (scanner) {

              await scanner.stop();

              scanner.clear();

              scanner = null;
            }

          } catch (error) {

            console.log(
              "停止掃描器時發生錯誤",
              error
            );

            scanner = null;
          }


          hint.classList.remove(
            "active"
          );

          scanButton.disabled =
            false;

          scanButton.innerText =
            "📷 掃描條碼";

          // 成功辨識後直接查資料庫。
          searchBarcode(
            decodedText
          );

        },

        function(errorMessage) {
          // 每幀未辨識成功是正常狀態，不顯示 alert。
        }

      );


      scanButton.disabled =
        false;

      scanButton.innerText =
        "📷 掃描中...";

    } catch (error) {

      console.error(error);

      scanner = null;

      scanButton.disabled =
        false;

      scanButton.innerText =
        "📷 掃描條碼";

      hint.classList.remove(
        "active"
      );

      alert(
        "無法開啟相機：" +
        error
      );
    }
  }

let allItems = [];


const COLLECTION_CACHE_KEY =
  "myCollectionItemsCache_v2";

const COLLECTION_CACHE_TIME_KEY =
  "myCollectionItemsCacheTime_v2";


function readCollectionCache() {

  try {

    const raw =
      localStorage.getItem(
        COLLECTION_CACHE_KEY
      );

    if (!raw) {
      return null;
    }

    const items =
      JSON.parse(raw);

    return Array.isArray(items)
      ? items
      : null;

  } catch (error) {

    console.warn(
      "收藏快取讀取失敗",
      error
    );

    return null;
  }
}


function writeCollectionCache(items) {

  try {

    localStorage.setItem(
      COLLECTION_CACHE_KEY,
      JSON.stringify(items)
    );

    localStorage.setItem(
      COLLECTION_CACHE_TIME_KEY,
      String(Date.now())
    );

  } catch (error) {

    // localStorage 空間不足時，不影響 App 正常使用。
    console.warn(
      "收藏快取寫入失敗",
      error
    );
  }
}


function clearCollectionCache() {

  try {

    localStorage.removeItem(
      COLLECTION_CACHE_KEY
    );

    localStorage.removeItem(
      COLLECTION_CACHE_TIME_KEY
    );

  } catch (error) {

    console.warn(
      "收藏快取清除失敗",
      error
    );
  }
}


function getCollectionCacheAgeText() {

  const timestamp =
    Number(
      localStorage.getItem(
        COLLECTION_CACHE_TIME_KEY
      ) || 0
    );

  if (!timestamp) {
    return "";
  }

  const seconds =
    Math.max(
      0,
      Math.floor(
        (Date.now() - timestamp) /
        1000
      )
    );

  if (seconds < 60) {
    return "剛剛";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  if (minutes < 60) {
    return minutes + " 分鐘前";
  }

  const hours =
    Math.floor(
      minutes / 60
    );

  return hours + " 小時前";
}




function loadCollectionList() {

  const count =
    document.getElementById(
      "collectionCount"
    );

  /*
    先立刻顯示上次的本機快取。
    Google Sheet 則在背景更新。
  */
  const cachedItems =
    readCollectionCache();

  if (
    cachedItems &&
    cachedItems.length >= 0
  ) {

    allItems =
      cachedItems;

    updateCategoryFilter();

    filterCollectionList();

    const age =
      getCollectionCacheAgeText();

    count.innerText =
      "目前共有 " +
      allItems.length +
      " 件收藏" +
      (
        age
          ? " ・ 快取 " + age
          : ""
      ) +
      " ・ 更新中…";

  } else {

    count.innerText =
      "⏳ 載入收藏中...";
  }


  const callbackName =
    "listCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      if (!data.success) {

        /*
          已有快取就繼續讓使用者使用，
          只提示背景更新失敗。
        */
        if (
          cachedItems
        ) {

          count.innerText =
            "目前共有 " +
            allItems.length +
            " 件收藏 ・ ⚠️ 更新失敗";

        } else {

          count.innerText =
            "❌ 無法載入收藏：" +
            (
              data.error ||
              "未知錯誤"
            );
        }

        cleanup();

        return;
      }


      allItems =
        data.items || [];


      writeCollectionCache(
        allItems
      );


      updateCategoryFilter();

      filterCollectionList();


      count.innerText =
        "目前共有 " +
        allItems.length +
        " 件收藏";


      cleanup();
    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    "?action=list" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      if (
        cachedItems
      ) {

        count.innerText =
          "目前共有 " +
          allItems.length +
          " 件收藏 ・ ⚠️ 更新失敗";

      } else {

        count.innerText =
          "❌ 無法連線到收藏資料";
      }

      cleanup();
    };


  document.body.appendChild(
    script
  );


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );
    }

    delete window[
      callbackName
    ];
  }

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatDateValue(value) {

  if (!value) {
    return "-";
  }

  const text =
    String(value);

  const date =
    new Date(text);

  if (isNaN(date.getTime())) {
    return text;
  }

  return date.toLocaleDateString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );
}

function toDateInputValue(value) {

  if (!value) {
    return "";
  }

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return String(value).slice(0, 10);
  }

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );
}

function handleEditImageSelect(input) {

  const file =
    input.files &&
    input.files[0];

  if (!file) {

    editImageBase64 = "";
    editImageMimeType = "";
    editImageName = "";

    document
      .getElementById("editImageInfo")
      .innerText =
      "不選新圖片就會保留目前圖片";

    return;
  }

  document
    .getElementById("editImageInfo")
    .innerText =
    "⏳ 正在處理新圖片...";


  compressImage(
    file,
    1600,
    0.82
  )
    .then(function(result) {

      editImageBase64 =
        result.dataUrl
          .split(",")[1];

      editImageMimeType =
        "image/jpeg";

      editImageName =
        (file.name ||
          "collection-image")
          .replace(/\.[^.]+$/, "") +
        ".jpg";

      const preview =
        document.getElementById(
          "editImagePreview"
        );

      preview.src =
        result.dataUrl;

      preview.style.display =
        "block";

      document
        .getElementById("editImageInfo")
        .innerText =
        "✅ 新圖片已準備好";

    })
    .catch(function(error) {

      console.error(error);

      editImageBase64 = "";
      editImageMimeType = "";
      editImageName = "";

      alert(
        "圖片處理失敗：" +
        error
      );

    });
}

function reloadCollectionAfterEdit(itemId) {

  return new Promise(
    function(resolve) {

      const callbackName =
        "editReloadCallback_" +
        Date.now();

      window[callbackName] =
        function(data) {

          if (
            data.success &&
            Array.isArray(data.items)
          ) {

            allItems =
              data.items;

            writeCollectionCache(
              allItems
            );

            updateCategoryFilter();

            filterCollectionList();

            const newIndex =
              allItems.findIndex(
                function(item) {
                  return (
                    String(item.id) ===
                    String(itemId)
                  );
                }
              );

            document
              .getElementById("editPage")
              .classList.remove("active");

            if (newIndex >= 0) {
              showItemDetail(
                newIndex
              );
            } else {
              document
                .getElementById("collectionPage")
                .classList.add("active");
            }
          }

          cleanup();
          resolve();
        };


      const script =
        document.createElement(
          "script"
        );

      script.src =
        WEB_APP_URL +
        "?action=list" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();

      script.onerror =
        function() {

          cleanup();
          resolve();

          alert(
            "修改可能已完成，但重新載入收藏失敗，請重新整理頁面。"
          );
        };

      document.body.appendChild(
        script
      );


      function cleanup() {

        if (script.parentNode) {
          script.parentNode
            .removeChild(script);
        }

        delete window[
          callbackName
        ];
      }

    }
  );
}

function renderCollectionList(items) {

  const list =
    document.getElementById(
      "collectionList"
    );

  const count =
    document.getElementById(
      "collectionCount"
    );


  count.innerText =
    "目前共有 " +
    items.length +
    " 件收藏";


  if (items.length === 0) {

    list.innerHTML =
      '<div class="empty-list-message">沒有符合的收藏</div>';

    return;
  }


  let html = "";


  items.forEach(function(item) {

    const imageSrc =
      getDisplayImageUrl(
        item.imageUrl,
        500
      );


    const imageHtml =
      imageSrc
        ? `
          <img
            src="${escapeHtml(imageSrc)}"
            alt="收藏圖片"
            loading="lazy"
            decoding="async"
          >
        `
        : `
          <div class="collection-placeholder">
            📦
          </div>
        `;


    const realIndex =
      allItems.indexOf(item);


    html += `

      <div
        class="collection-item"
        onclick="showItemDetail(${realIndex})"
      >

        ${imageHtml}

        <div class="collection-info">

          <div class="collection-name">
            ${escapeHtml(item.name || "未命名")}
          </div>

          <div class="collection-meta">

            ${
              item.category
                ? "分類：" +
                  escapeHtml(item.category) +
                  "<br>"
                : ""
            }

            ${
              item.location
                ? "📍 " +
                  escapeHtml(item.location) +
                  "<br>"
                : ""
            }

            數量：
            ${escapeHtml(item.quantity || 1)}

            ${
              item.price
                ? "<br>💰 " +
                  escapeHtml(item.price)
                : ""
            }

          </div>

        </div>

      </div>

    `;

  });


  list.innerHTML =
    html;
}


function updateCategoryFilter() {

  const select =
    document.getElementById(
      "categoryFilter"
    );

  if (!select) {
    return;
  }

  const currentValue =
    select.value;

  const categories =
    Array.from(
      new Set(
        allItems
          .map(function(item) {
            return String(
              item.category || ""
            ).trim();
          })
          .filter(Boolean)
      )
    )
      .sort(function(a, b) {
        return a.localeCompare(
          b,
          "zh-Hant"
        );
      });


  select.innerHTML =
    '<option value="">全部分類</option>' +
    categories
      .map(function(category) {
        return (
          '<option value="' +
          escapeHtml(category) +
          '">' +
          escapeHtml(category) +
          '</option>'
        );
      })
      .join("");


  if (
    categories.includes(
      currentValue
    )
  ) {
    select.value =
      currentValue;
  }
}


function filterCollectionList() {

  const keyword =
    document
      .getElementById(
        "textSearch"
      )
      .value
      .trim()
      .toLowerCase();

  const category =
    document
      .getElementById(
        "categoryFilter"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allItems.filter(
      function(item) {

        const itemCategory =
          String(
            item.category || ""
          )
            .trim()
            .toLowerCase();

        const categoryMatch =
          !category ||
          itemCategory === category;

        if (!categoryMatch) {
          return false;
        }


        if (!keyword) {
          return true;
        }


        const text = [
          item.name,
          item.category,
          item.location,
          item.notes,
          item.barcode
        ]
          .join(" ")
          .toLowerCase();


        return text.includes(
          keyword
        );

      }
    );


  renderCollectionList(
    filtered
  );

}
